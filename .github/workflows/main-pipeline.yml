name: Sock Shop CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER_NAME: sockshop-eks

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Validate Kubernetes manifests
        run: |
          echo "🔍 Validating Kubernetes manifests..."
          
          if [ -d "deploy/kubernetes" ]; then
            echo "✅ Deploy directory found"
            
            if [ -f "deploy/kubernetes/complete-demo.yaml" ]; then
              echo "Validating complete-demo.yaml..."
              kubectl apply --dry-run=client -f deploy/kubernetes/complete-demo.yaml
              echo "✅ complete-demo.yaml is valid"
            fi
          fi
          
          if [ -f "monitoring-lightweight.yaml" ]; then
            echo "Validating monitoring-lightweight.yaml..."
            kubectl apply --dry-run=client -f monitoring-lightweight.yaml
            echo "✅ monitoring-lightweight.yaml is valid"
          fi
          
          if [ -f "fix-services.yaml" ]; then
            echo "Validating fix-services.yaml..."
            kubectl apply --dry-run=client -f fix-services.yaml
            echo "✅ fix-services.yaml is valid"
          fi
          
          echo "✅ All manifest validations completed!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to staging
        run: |
          kubectl create namespace sock-shop-staging --dry-run=client -o yaml | kubectl apply -f -
          
          if [ -f "deploy/kubernetes/complete-demo.yaml" ]; then
            kubectl apply -f deploy/kubernetes/complete-demo.yaml -n sock-shop-staging
          fi

      - name: Check deployment
        run: |
          kubectl get pods -n sock-shop-staging
          kubectl get svc -n sock-shop-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          kubectl create namespace sock-shop --dry-run=client -o yaml | kubectl apply -f -
          
          if [ -f "deploy/kubernetes/complete-demo.yaml" ]; then
            kubectl apply -f deploy/kubernetes/complete-demo.yaml -n sock-shop
          fi
          
          if [ -f "fix-services.yaml" ]; then
            kubectl apply -f fix-services.yaml -n sock-shop
          fi
          
          if [ -f "monitoring-lightweight.yaml" ]; then
            kubectl apply -f monitoring-lightweight.yaml
          fi

      - name: Check deployment
        run: |
          kubectl get pods -n sock-shop
          kubectl get svc -n sock-shop
          echo "Application URL:"
          kubectl get svc front-end -n sock-shop
