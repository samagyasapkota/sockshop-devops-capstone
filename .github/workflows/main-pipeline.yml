name: Sock Shop CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER_NAME: sockshop-eks

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Validate Kubernetes manifests
        run: |
          echo "🔍 Validating Kubernetes manifests..."
          
          if [ -f "deploy/kubernetes/complete-demo.yaml" ]; then
            echo "✅ Found deploy/kubernetes/complete-demo.yaml"
            kubectl apply --dry-run=client -f deploy/kubernetes/complete-demo.yaml || echo "⚠️ Validation warnings (non-critical)"
          else
            echo "❌ deploy/kubernetes/complete-demo.yaml not found"
            exit 1
          fi
          
          if [ -f "monitoring-lightweight.yaml" ]; then
            echo "✅ Found monitoring-lightweight.yaml"
          fi
          
          if [ -f "fix-services.yaml" ]; then
            echo "✅ Found fix-services.yaml"
          fi
          
          echo "✅ Validation completed!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          kubectl create namespace sock-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/kubernetes/complete-demo.yaml -n sock-shop
          
          if [ -f "fix-services.yaml" ]; then
            kubectl apply -f fix-services.yaml -n sock-shop || true
          fi
          
          if [ -f "monitoring-lightweight.yaml" ]; then
            kubectl apply -f monitoring-lightweight.yaml || true
          fi

      - name: Check deployment
        run: |
          echo "Waiting for deployments..."
          sleep 30
          kubectl get pods -n sock-shop
          kubectl get svc -n sock-shop
